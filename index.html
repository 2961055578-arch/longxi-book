<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>龙息书摊 - 看完就上头的短篇故事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f4f4;color:#333;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{display:none}
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#e74c3c,#e67e22);padding:12px 14px;display:flex;align-items:center;gap:10px}
.top .nm{font-size:19px;font-weight:700;color:#fff;white-space:nowrap}
.top .nm span{color:#f1c40f}
.top .sb{flex:1;height:34px;background:rgba(255,255,255,.25);border-radius:17px;padding:0 14px;display:flex;align-items:center;gap:4px}
.top .sb i{color:rgba(255,255,255,.7);font-size:14px;font-style:normal}
.top .sb input{flex:1;border:0;background:0;outline:0;font-size:13px;color:#fff;-webkit-appearance:none}
.top .sb input::placeholder{color:rgba(255,255,255,.6)}
.bw{padding:10px 10px 0;margin-top:58px}
.bn{position:relative;border-radius:12px;overflow:hidden;background:#ddd;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.bs{display:flex;transition:transform .4s}
.bi{min-width:100%;position:relative;display:flex;align-items:flex-end;aspect-ratio:16/6;padding:14px}
.bi .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.bi .msk{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.7))}
.bi .if{position:relative;z-index:1;color:#fff}
.bi .if h2{font-size:15px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90%}
.bi .if p{font-size:11px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{position:absolute;bottom:6px;right:10px;display:flex;gap:4px;z-index:2}
.bd span{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);transition:all .3s}
.bd span.c{width:14px;background:#fff}
.tb{display:flex;padding:0 10px;margin-top:8px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;position:sticky;top:58px;z-index:50}
.tb .tb-i{padding:10px 14px;font-size:13px;color:#666;white-space:nowrap;cursor:pointer;position:relative;flex-shrink:0}
.tb .tb-i.c{color:#e74c3c;font-weight:600}
.tb .tb-i.c::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:18px;height:2.5px;background:#e74c3c;border-radius:2px}
.bl{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;padding-bottom:70px}
.bc{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer;transition:transform .15s}
.bc:active{transform:scale(.97)}
.bc .cv{width:100%;aspect-ratio:3/4;background:#e8e8e8;position:relative;overflow:hidden}
.bc .cv img{width:100%;height:100%;object-fit:cover;display:block}
.bc .cv .tg{position:absolute;top:5px;left:5px;font-size:9px;padding:1px 7px;border-radius:6px;color:#fff;font-weight:500}
.bc .cv .tg.h{background:#e74c3c}
.bc .cv .tg.n{background:#27ae60}
.bc .if{padding:8px 10px 10px}
.bc .if h4{font-size:13px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;line-height:1.3}
.bc .if .au{font-size:11px;color:#999;margin-bottom:3px}
.bc .if .mt{display:flex;justify-content:space-between;font-size:10px;color:#aaa}
.bc .if .mt .st{color:#e67e22}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.78);color:#fff;padding:14px 24px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:all .25s;pointer-events:none;text-align:center;max-width:80%}
.toast.s{opacity:1;transform:translate(-50%,-50%) scale(1)}
.rd{position:fixed;inset:0;z-index:200;background:#f5efe6;display:none;flex-direction:column}
.rd.s{display:flex}
.rd .rh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #e0d8cc;background:#f5efe6;position:sticky;top:0;z-index:10}
.rd .rh .bk{font-size:20px;cursor:pointer;color:#666;font-style:normal;padding:4px 8px 4px 0}
.rd .rh .rt{font-size:14px;font-weight:600;color:#333;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd .rh .ad{font-size:11px;color:#999;background:#e0d8cc;padding:4px 12px;border-radius:12px;white-space:nowrap}
.rd .rb{flex:1;padding:18px 18px 30px;overflow-y:auto;line-height:2;font-size:16px;color:#3a3a3a;background:#f5efe6}
.rd .rb p{margin-bottom:12px;text-indent:2em;word-break:break-word}
.rd .rb .sep{text-align:center;color:#c0b8aa;font-size:14px;margin:6px 0;text-indent:0}
.rd .rb .end{margin-top:24px;color:#c0b8aa;font-size:13px;text-align:center;padding:16px 0;border-top:1px solid #e0d8cc;text-indent:0}
.btm{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;display:flex;justify-content:space-around;align-items:center;padding:5px 0 7px;border-top:1px solid #eee}
.btm .bi{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:#999;cursor:pointer;min-width:48px}
.btm .bi i{font-size:20px;line-height:1;font-style:normal}
.btm .bi.c{color:#e74c3c}
.ld{text-align:center;padding:60px 0;color:#999;font-size:13px;grid-column:1/-1}
.ld .sp{display:inline-block;width:24px;height:24px;border:3px solid #eee;border-top-color:#e74c3c;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="top"><div class="nm">龙息<span>书摊</span></div><div class="sb" onclick="T('搜索功能即将上线')">⌕<input placeholder="搜搜故事..." readonly></div></div>
<div class="bw"><div class="bn"><div class="bs" id="bs"></div><div class="bd" id="bd"></div></div></div>
<div class="tb" id="tb"></div>
<div class="bl" id="bl"><div class="ld"><div class="sp"></div><br>正在加载故事...</div></div>
<div class="btm"><div class="bi c"><i>📚</i><span>书摊</span></div><div class="bi" onclick="T('分类功能即将上线')"><i>📋</i><span>分类</span></div><div class="bi" onclick="T('书架功能即将上线')"><i>📬</i><span>书架</span></div><div class="bi" onclick="T('个人中心即将上线')"><i>👤</i><span>我的</span></div></div>
<div class="rd" id="rd"><div class="rh"><i class="bk" onclick="closeReader()">←</i><span class="rt" id="rt"></span><span class="ad" id="ra"></span></div><div class="rb" id="rb"></div></div>
<script>

var DB=[];var cur="all",bni=0,bnt=null;var BOOKS_URL="./books.json";
function T(m){var e=document.getElementById("toast");e.textContent=m;e.className="toast s";clearTimeout(e._t);e._t=setTimeout(function(){e.className="toast";},1800);}
async function loadSiteBooks(){
  // 优先从后端 API 读取（本地环境实时同步）
  async function tryAPI() {
    try {
      var r = await fetch("/api/site/books");
      if (!r.ok) return null;
      var d = await r.json();
      if (d.data && d.data.length) return d.data;
      return null;
    } catch(e) { return null; }
  }
  async function tryFile() {
    try {
      var r = await fetch(BOOKS_URL + "?t=" + Date.now());
      if (!r.ok) return null;
      var d = await r.json();
      if (d.data) return d.data;
      if (Array.isArray(d) && d.length) return d;
      return null;
    } catch(e) { return null; }
  }
  try {
    var books = await tryAPI() || await tryFile();
    if (books && books.length) {
      DB = books;
      initTabs();
      rdBanner();
      renderList();
    } else {
      document.getElementById("bl").innerHTML='<div class="ld">暂无故事</div>';
    }
  } catch(e) {
    document.getElementById("bl").innerHTML='<div class="ld">网络错误</div>';
  }
}


function initTabs(){var cats={"悬疑": 1, "都市": 1, "科幻": 1};
var keys=["全部"];for(var k in cats)keys.push(k);
var order={"悬疑": 1, "都市": 2, "科幻": 3};
keys.sort(function(a,b){if(a==="全部")return -1;if(b==="全部")return 1;var oa=order[a]||99,ob=order[b]||99;return oa-ob;});
var tb=document.getElementById("tb");var h="";
for(var i=0;i<keys.length;i++){var cl=i===0?"tb-i c":"tb-i";h+='<div class="'+cl+'" data-c="'+keys[i]+'">'+keys[i]+'</div>';}
tb.innerHTML=h;
var els=document.querySelectorAll(".tb .tb-i");
for(var i=0;i<els.length;i++){els[i].addEventListener("click",function(){filter(this.dataset.c);});}}


function rdBanner(){var s=document.getElementById("bs"),d=document.getElementById("bd");var hs=[];for(var i=0;i<DB.length&&hs.length<5;i++){if(DB[i].b==="hot"||DB[i].badge==="hot")hs.push(DB[i]);}if(!hs.length){for(var i=0;i<Math.min(DB.length,4);i++)hs.push(DB[i]);}if(!hs.length)return;var h="";for(var i=0;i<hs.length;i++){var x=hs[i];var ct=x.t||x.title||"";var cd=x.d||x.description||"";var cc=x.c||x.cover||"";h+='<div class="bi" onclick="openR('+(x.id||x.i)+','+(x.i||0)+')"><div class="bg" style="background-image:url('+cc+')"></div><div class="msk"></div><div class="if"><h2>'+ct+'</h2><p>'+cd.substring(0,40)+'</p></div></div>';}s.innerHTML=h;h="";for(var i=0;i<hs.length;i++){h+='<span'+(i===0?' class="c"':'')+'></span>';}d.innerHTML=h;startBanner(hs.length);}
function startBanner(c){if(bnt)clearInterval(bnt);if(c<2)return;var s=document.getElementById("bs");var d=document.querySelectorAll("#bd span");bnt=setInterval(function(){bni=(bni+1)%c;s.style.transform='translateX(-'+(bni*100)+'%)';for(var i=0;i<d.length;i++){d[i].className=i===bni?"c":"";}},3500);}
function filter(g){cur=g||"all";var t=document.querySelectorAll(".tb .tb-i");for(var i=0;i<t.length;i++){var v=t[i].dataset.c;t[i].className=(v===cur||(cur==="all"&&v==="全部"))?"tb-i c":"tb-i";}renderList();}
function renderList(){var l=document.getElementById("bl");var books=cur==="全部"||cur==="all"?DB:DB.filter(function(x){return (x.g||x.category||"其他")===cur;});if(!books.length){l.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#999;font-size:14px;">该分类暂无故事<br><span style="font-size:12px;color:#bbb;">换个分类看看吧</span></div>';return;}var h="";for(var i=0;i<books.length;i++){var x=books[i];var id=x.id||x.i||0;var tit=x.title||x.t||"";var aut=x.author||x.a||"匿名";var cov=x.cover||x.c||"";var rat=x.rating||x.p||"4.5";var eps=x.episodes||x.n||"0";var badge=x.badge||x.b||"";var tag=badge?'<span class="tg '+(badge==="hot"?"h":"n")+'">'+(badge==="hot"?"热门":"新书")+'</span>':"";h+='<div class="bc" onclick="openR('+id+','+(x.i||0)+')"><div class="cv"><img src="'+cov+'" alt="'+tit+'" onerror="this.outerHTML='+"'<div style=width:100%;height:100%;background:linear-gradient(135deg,#e74c3c,#e67e22);display:flex;align-items:center;justify-content:center;font-size:40px;color:rgba(255,255,255,.6);>书</div>'"+'">'+tag+'</div><div class="if"><h4>'+tit+'</h4><div class="au">'+aut+'</div><div class="mt"><span class="st">&#9733; '+rat+'</span><span>'+eps+'集</span></div></div></div>';}l.innerHTML=h;}
function findBook(id,idx){for(var i=0;i<DB.length;i++){var x=DB[i];if(x.id===id||x.i===id||x.i===idx)return x;}return null;}
function openR(id,idx){var x=findBook(id,idx);if(!x){T("故事不存在");return;}var tit=x.title||x.t||"";var aut=x.author||x.a||"";var summary=x.summary||x.s||"";document.getElementById("rt").textContent=tit;document.getElementById("ra").textContent=aut;var paras=summary.split("\n");var html="";for(var i=0;i<paras.length;i++){var p=paras[i].trim();if(!p)continue;if(p.indexOf("—")===0||p.length<3){html+='<p class="sep">'+p+'</p>';}else{var sentences=p.split(/[。！？]/);var chunk="";for(var j=0;j<sentences.length;j++){if(!sentences[j].trim())continue;chunk+=sentences[j].trim()+(j<sentences.length-1?"。":"");if(chunk.length>60||j===sentences.length-1){html+='<p>'+chunk+'</p>';chunk="";}}}}html+='<p class="end">— 未完待续，关注“龙息书摊”看更多故事 —</p>';document.getElementById("rb").innerHTML=html;document.getElementById("rd").className="rd s";document.getElementById("rb").scrollTop=0;}
function closeReader(){document.getElementById("rd").className="rd";}
loadSiteBooks();

</script>
</body>
</html>
